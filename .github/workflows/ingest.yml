name: Ingest

# Ingestion runs here rather than on Vercel: bulk downloads take minutes to hours.
# Repository secrets: DIRECT_URL (Neon *unpooled* connection string), SEC_USER_AGENT
# ("FedFlow you@domain.com"), SAM_API_KEY (optional; parent lookups are skipped without it).

on:
  schedule:
    # Daily at 09:17 UTC. USAspending typically publishes overnight (US time).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job"
        type: choice
        options: [usaspending-daily, usaspending-backfill, usaspending-agencies, rollup, edgar-companies, sam-parents, match-tickers, rollup-companies, tag-programs, prices, alerts, dod-announcements, sam-opportunities, federal-register, edgar-filings]
        default: usaspending-daily
      args:
        description: "Extra args, e.g. --month 2024-03 --kind contracts, or --full for rollup"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Hosted runners stop at 6h. The backfill is resumable: re-run it and it continues
    # with the first month not yet loaded.
    timeout-minutes: 350
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER }}
      MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
      # Optional: job failures are reported to Sentry when set.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
      # Needed by the alerts job (Pro watchlist emails) and its links.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Run job
        run: pnpm ingest ${{ github.event.inputs.job || 'usaspending-daily' }} ${{ github.event.inputs.args }}
      - name: Weekly SEC refresh and full rebuilds (Sundays)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            pnpm ingest edgar-companies
            pnpm ingest rollup --full
            pnpm ingest match-tickers --full
          fi
      - name: SAM.gov parent lookups (daily budget)
        if: github.event_name == 'schedule'
        run: pnpm ingest sam-parents
